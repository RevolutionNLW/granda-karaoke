name: Windows x64

# Builds Frankie's Karaoke Studio for Windows 11 x64 with MSVC, the official
# Qt 6 MSVC build and the official GStreamer MSVC runtime, then runs every
# automated test. Nothing here ever uses real karaoke media.

on:
  push:
    branches: [main, windows-prep]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  GST_VERSION: "1.28.7"
  GST_SHA256: "032fc6062b8539838fc8da22589cb9b24c5d820baa7f8cc160af9ea08395badf"
  GST_DIR: 'C:\gstreamer'
  QT_DIR: 'C:\Qt'

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      packaged: ${{ steps.package.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # aqtinstall cannot read the Qt 6.11 repository layout yet, so the
      # official prebuilt qtbase and qttools archives are fetched directly from download.qt.io
      # and checked against its published SHA-1.
      # Restored and saved separately: actions/cache would only save when the
      # whole job succeeds.
      - name: Restore Qt ${{ env.QT_VERSION }}
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-msvc2022_64-qtbase-qttools-v2

      - name: Install official Qt ${{ env.QT_VERSION }} (MSVC 2022 x64)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:QT_VERSION -replace '\.', ''
          $repo = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_$v/qt6_${v}_msvc2022_64"
          Invoke-WebRequest -Uri "$repo/Updates.xml" -OutFile "$env:RUNNER_TEMP\qt-updates.xml"
          [xml]$updates = Get-Content -Raw "$env:RUNNER_TEMP\qt-updates.xml"
          $package = $updates.Updates.PackageUpdate | Where-Object { $_.Name -eq "qt.qt6.$v.win64_msvc2022_64" }
          if (-not $package) { throw "Qt package qt.qt6.$v.win64_msvc2022_64 not found" }
          $archives = $package.DownloadableArchives -split ',\s*' | Where-Object { $_ -like 'qtbase-*' -or $_ -like 'qttools-*' }
          New-Item -ItemType Directory -Force -Path $env:QT_DIR | Out-Null
          foreach ($archive in $archives) {
            $name = "$($package.Version)$archive"
            $file = "$env:RUNNER_TEMP\$archive"
            Invoke-WebRequest -Uri "$repo/$($package.Name)/$name" -OutFile $file
            Invoke-WebRequest -Uri "$repo/$($package.Name)/$name.sha1" -OutFile "$file.sha1"
            $expected = ((Get-Content -Raw "$file.sha1").Trim() -split '\s+')[0]
            $actual = (Get-FileHash $file -Algorithm SHA1).Hash.ToLower()
            if ($actual -ne $expected.ToLower()) { throw "Checksum mismatch for $archive" }
            7z x $file "-o$env:QT_DIR" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not extract $archive" }
          }

      - name: Save Qt ${{ env.QT_VERSION }}
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_DIR }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Use Qt ${{ env.QT_VERSION }}
        shell: pwsh
        run: |
          $config = Get-ChildItem -Path $env:QT_DIR -Recurse -Filter Qt6Config.cmake | Select-Object -First 1
          if (-not $config) { throw "Qt6Config.cmake not found under $env:QT_DIR" }
          $prefix = $config.Directory.Parent.Parent.Parent.FullName
          Write-Host "Qt prefix: $prefix"
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore GStreamer ${{ env.GST_VERSION }}
        id: gst-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GST_DIR }}
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}-v1

      - name: Install official GStreamer ${{ env.GST_VERSION }} (MSVC x86_64)
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\gstreamer.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GST_SHA256) { throw "GStreamer installer checksum mismatch: $hash" }
          $log = "$env:RUNNER_TEMP\gstreamer-install.log"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',
            '/TYPE=full', "/DIR=$env:GST_DIR", "/LOG=$log")
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "GStreamer installer failed: $($p.ExitCode)" }

      - name: Save GStreamer ${{ env.GST_VERSION }}
        if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GST_DIR }}
          key: ${{ steps.gst-cache.outputs.cache-primary-key }}

      - name: Locate GStreamer SDK root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $header = Get-ChildItem -Path $env:GST_DIR -Recurse -Filter gst.h -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*include\gstreamer-1.0\gst\gst.h' } | Select-Object -First 1
          if (-not $header) {
            Get-ChildItem $env:GST_DIR -Depth 3 | Select-Object -First 80 | ForEach-Object { $_.FullName }
            throw "GStreamer development headers were not installed"
          }
          $root = $header.Directory.Parent.Parent.Parent.FullName
          Write-Host "GStreamer SDK root: $root"
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$root\bin\gst-inspect-1.0.exe" --version

      - name: Required GStreamer elements present in the SDK
        shell: pwsh
        run: |
          $missing = @()
          foreach ($e in 'playbin','decodebin','uridecodebin','filesrc','typefind','id3demux','mpegaudioparse',
                         'mpg123audiodec','audioconvert','audioresample','capsfilter','scaletempo','pitch',
                         'volume','audiotestsrc','autoaudiosink','wasapi2sink','fakesink','lamemp3enc','filesink','id3v2mux') {
            & "$env:GSTREAMER_ROOT\bin\gst-inspect-1.0.exe" --exists $e
            if ($LASTEXITCODE -ne 0) { $missing += $e }
          }
          if ($missing) { throw "Missing GStreamer elements: $($missing -join ', ')" }
          Write-Host "All required GStreamer elements found."

      - name: Configure (Release x64, warnings are errors)
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_PREFIX"
          -DGSTREAMER_ROOT="$env:GSTREAMER_ROOT"
          -DFKS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase
          -DCMAKE_EXE_LINKER_FLAGS="/DEBUG /OPT:REF /OPT:ICF"

      - name: Build
        run: cmake --build build -- -k 0

      # On Windows QtTest writes to the debugger unless told otherwise.
      # The package is still made when a test fails (the job fails at the
      # end), so one run reports on everything.
      - name: Test
        id: tests
        continue-on-error: true
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
          # Qt's offscreen test platform has no fonts of its own on Windows.
          QT_QPA_FONTDIR: 'C:\Windows\Fonts'
        run: ctest --test-dir build --output-on-failure --timeout 300

      # Timings to compare with a Mac (the metadata resolver is far slower
      # here); information only.
      - name: Benchmark
        continue-on-error: true
        shell: pwsh
        run: ./build/tests/fks-bench.exe "$env:RUNNER_TEMP/bench"

      - name: Upload test logs on failure
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/gstreamer-install.log
          if-no-files-found: ignore

      - name: Package (portable x64 folder)
        id: package
        shell: pwsh
        run: >
          ./packaging/windows/package.ps1
          -BuildDir build -QtPrefix "$env:QT_PREFIX" -GStreamerRoot "$env:GSTREAMER_ROOT"
          -Output "$env:RUNNER_TEMP/FrankiesKaraokeStudio-Windows-x64"

      # Downloads as FrankiesKaraokeStudio-Windows-x64.zip.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FrankiesKaraokeStudio-Windows-x64
          path: ${{ runner.temp }}/FrankiesKaraokeStudio-Windows-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: FrankiesKaraokeStudio-Windows-x64-symbols
          path: build/FrankiesKaraokeStudio.pdb
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if any test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # A fresh Windows machine with no Qt, GStreamer or build tools, as on the
  # laptop: the package must run from its own folder alone.
  package-smoke-test:
    needs: build-test
    if: always() && needs.build-test.outputs.packaged == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/windows

      - uses: actions/download-artifact@v4
        with:
          name: FrankiesKaraokeStudio-Windows-x64
          path: ${{ runner.temp }}/package

      # A virtual sound card (VB-CABLE) on this throwaway machine, so real
      # Windows sound output is exercised. Pinned to a reviewed commit.
      - name: Windows Audio service
        shell: pwsh
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service -Name Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table -AutoSize Name, Status

      - name: Virtual sound card
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf  # v1.0.4

      - name: Run the packaged program on a clean machine
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -Package "$env:RUNNER_TEMP/package" -ExpectSound

      - name: Collect smoke-test logs
        if: always()
        shell: pwsh
        run: |
          $logs = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/smoke-logs"
          Copy-Item "$env:RUNNER_TEMP/installation-check.txt" $logs -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/Granda/FrankiesKaraokeStudio/*.log*" $logs -ErrorAction SilentlyContinue

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-logs
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
